[build]
  command = "npm run build"
  publish = "dist"

# Old multi-page routes → single-page anchors
[[redirects]]
  from = "/why"
  to = "/#why"
  status = 301

[[redirects]]
  from = "/demo"
  to = "/#demo"
  status = 301

[[redirects]]
  from = "/get-started"
  to = "/#get-started"
  status = 301

[build.environment]
  # Astro 6 requires Node >=22.12.0 (see package.json engines).
  NODE_VERSION = "22"

# Optional: proxy the Astro dev server via Netlify CLI (`netlify dev`).
[dev]
  command = "npm run dev"
  targetPort = 4321
